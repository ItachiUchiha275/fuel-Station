services:
  - type: web
    name: parkease
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app:app --host 0.0.0.0 --port 10000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parkease-db
          property: connectionString
    autoDeploy: false

databases:
  - name: parkease-db
    databaseName: parkease
    user: parkease
